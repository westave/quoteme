version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quoteme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quoteme_user
      POSTGRES_PASSWORD: quoteme_password
      POSTGRES_DB: quoteme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quoteme_user -d quoteme"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quoteme-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://quoteme_user:quoteme_password@postgres:5432/quoteme?schema=public
      JWT_SECRET: super-secret-jwt-key-change-in-production-min-32-chars
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quoteme-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    stdin_open: true
    tty: true

volumes:
  postgres_data:
